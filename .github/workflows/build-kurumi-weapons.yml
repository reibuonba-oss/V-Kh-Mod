name: Build Kurumi Exclusive Weapons Mod

on:
  workflow_dispatch:
  push:
    branches: [kurumi-weapons-v1]
    paths:
      - "Modding/KurumiWeapons/**"
      - "tools/**"
      - "d7232u4-3a6527c6-e26e-4407-b675-a3d6a3d51370.jpg"
      - "Manager.zip"
      - ".github/workflows/build-kurumi-weapons.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate separated transparent gun sprites
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow opencv-python-headless numpy
          python tools/build_weapon_sprites.py "d7232u4-3a6527c6-e26e-4407-b675-a3d6a3d51370.jpg" "Modding/KurumiWeapons/Textures/Items"
          if (-not (Test-Path "Modding/KurumiWeapons/Textures/Items/kurumi_long_rifle.png")) { throw "Long rifle sprite missing." }
          if (-not (Test-Path "Modding/KurumiWeapons/Textures/Items/kurumi_pistol.png")) { throw "Pistol sprite missing." }

      - name: Extract game assemblies
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "Manager.zip"
          if (-not (Test-Path $archive)) { throw "Manager.zip is missing." }
          $out = Join-Path $env:RUNNER_TEMP "PS-Manager"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $out, $true)
          $dll = Get-ChildItem -Path $out -Filter "Assembly-CSharp.dll" -Recurse -File | Select-Object -First 1
          if (-not $dll) { throw "Assembly-CSharp.dll not found in Manager.zip." }
          $managed = $dll.Directory.FullName
          foreach ($name in @("0Harmony.dll", "UnityEngine.dll", "UnityEngine.CoreModule.dll")) {
            if (-not (Test-Path (Join-Path $managed $name))) { throw "Missing required assembly: $name" }
          }
          "GAME_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build KurumiWeapons.dll
        shell: pwsh
        run: |
          dotnet build "Modding/KurumiWeapons/KurumiWeapons.csproj" --configuration Release "-p:GameManagedDir=$env:GAME_MANAGED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installable mod
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "Modding/KurumiWeapons"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist/KurumiWeapons"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $source "bin/Release/netstandard2.1/KurumiWeapons.dll") $out -Force
          Copy-Item (Join-Path $source "manifest.xml") $out -Force
          Copy-Item (Join-Path $source "Localization") $out -Recurse -Force
          Copy-Item (Join-Path $source "Textures/Items") (Join-Path $out "Textures/Items") -Recurse -Force
          $zip = Join-Path $env:GITHUB_WORKSPACE "Kurumi-Weapons-Vietnamese.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          if ((Get-Item $zip).Length -lt 10000) { throw "Installable ZIP appears unexpectedly small." }

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Kurumi-Weapons-Vietnamese
          path: Kurumi-Weapons-Vietnamese.zip
          if-no-files-found: error
          retention-days: 14
